<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo de Adivinhação | AluraStart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="cabecalho">
    <h1 class="titulo">🎮 Jogo de Adivinhação</h1>
    <p class="subtitulo">Descubra o número secreto entre 1 e 100</p>
  </header>

  <main class="conteudo">
    <section class="painel">
      <h2 class="painel__titulo">Tente a sorte!</h2>

      <div class="painel__jogo" id="area-jogo">
        <p class="jogo__mensagem" id="mensagem-jogo">
          Digite um número e clique em <strong>Chutar</strong>.
        </p>
        <p class="jogo__tentativas">
          Tentativas: <span id="contador-tentativas">0</span>
        </p>
      </div>

      <div class="painel__entrada">
        <input
          type="number"
          id="input-chute"
          class="entrada"
          placeholder="Digite de 1 a 100"
          min="1"
          max="100"
        />
        <button class="botao botao--primario" id="btn-chutar">Chutar</button>
        <button class="botao botao--secundario" id="btn-reiniciar">Reiniciar</button>
      </div>
    </section>

    <aside class="feedback">
      <h2 class="feedback__titulo">💬 Feedback</h2>
      <p id="mensagem-feedback">Envie sua opinião sobre o jogo!</p>
      <textarea
        id="texto-feedback"
        class="entrada entrada--textarea"
        placeholder="O que você achou do jogo?"
      ></textarea>
      <button class="botao botao--primario" id="btn-enviar-feedback">
        Enviar feedback
      </button>
    </aside>
  </main>

  <footer class="rodape">
    <p>Projeto AluraStart — HTML, CSS e JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
